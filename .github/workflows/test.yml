name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Debug Workbench Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/debugging/webui/client/package-lock.json
      - name: Install and build frontend
        run: make web-build
      - name: Verify embedded assets are current
        run: git diff --exit-code -- internal/debugging/webui/dist
      - name: Provision Chromium
        working-directory: internal/debugging/webui/client
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run four real-browser Workbench smoke tests
        run: make web-test-browser

  logic:
    name: Logic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DISPLAY: ""
      WAYLAND_DISPLAY: ""
      GOMAXPROCS: "2"
      GOMEMLIMIT: 256MiB
      GOGC: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision dependencies
        run: go mod download
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision Python quality tools for bridge checks
        run: python -I -B scripts/python_quality.py provision
      - name: Enforce production and test dependency boundaries
        run: go run -p=1 ./scripts/check-core-dependencies
      - name: Execute logic assertions without a display
        run: go run -p=1 ./scripts/test-gate -profile=constrained -suite=logic

  debug-race:
    name: Debug Control Plane Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 256MiB
      GOGC: "50"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxxf86vm-dev \
            libasound2-dev \
            xvfb
      - name: Run debug control-plane race tests
        env:
          CGO_ENABLED: 1
        run: xvfb-run -a go test -count=1 -run=. -skip='^$' -list= -bench= -fuzz= -short=false -p=1 -parallel=1 -race ./internal/debugging/...

  render:
    name: Native Render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 256MiB
      GOGC: "50"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libxxf86vm-dev \
          libasound2-dev \
          xvfb

    # Ebitengine opens the audio device on the first frame after an audio context
    # exists and ends RunGame if that fails. Hosted Linux and Windows runners have
    # no sound device, so give them a virtual one (PulseAudio null sink / VB-CABLE).
    - name: Provide a virtual sound device (Linux/Windows)
      if: runner.os != 'macOS'
      uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4

    - name: Run required native tests with virtual display (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a make test-render

    - name: Run required native tests (macOS/Windows)
      if: runner.os != 'Linux'
      run: go run -p=1 ./scripts/test-gate -profile=constrained -suite=render

  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: ultimav-linux-amd64
          - os: macos-latest
            asset_name: ultimav-darwin-arm64
          - os: windows-latest
            asset_name: ultimav-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        env:
          CGO_ENABLED: 0
        run: go build -o bin/${{ matrix.asset_name }} ./cmd/ultimav

      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: bin/${{ matrix.asset_name }}
          retention-days: 7

  lint:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxxf86vm-dev \
            libasound2-dev \
            xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision pinned validation tools
        run: |
          make tools
          make python-tools
          make web-install
      - name: Run canonical logic validation and static policy gates
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
        run: make validate
