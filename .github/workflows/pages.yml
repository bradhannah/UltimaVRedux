name: Pages

# Builds the public site from the Game Facts and curated content, then pushes it to
# the gh-pages branch that GitHub Pages serves (Settings > Pages > Deploy from a
# branch: gh-pages, / (root)). This is a convenience: `make site-publish` runs the
# same script by hand whenever Actions is unavailable. See docs/SITE.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and push the site (standard library only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -B scripts/publish_site.py
